name: Scan Agendado - Vigilancia Continua

on:
  schedule:
    - cron: '0 3 * * *'   # Todos os dias às 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  revarredura-segredos:
    name: "Revarredura de Segredos (Gitleaks)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2

        # ==================================================================
        # CONFIGURACAO EXCLUSIVA PARA AMBIENTE DE LABORATORIO / TREINAMENTO
        #
        # Este repositorio contem exemplos didaticos relacionados a
        # vulnerabilidades, segredos expostos e demonstracoes de praticas
        # DevSecOps. Alguns arquivos sao mantidos intencionalmente para fins
        # de estudo e validacao de ferramentas de seguranca.
        #
        # O parametro "continue-on-error" foi habilitado para evitar falhas
        # recorrentes da execucao agendada e consequentes notificacoes
        # diarias por e-mail durante as atividades de laboratorio.
        #
        # IMPORTANTE:
        # Em uma esteira corporativa real esta configuracao NAO deve ser
        # utilizada. O comportamento recomendado e:
        #
        # 1. Remover segredos do codigo e do historico Git.
        # 2. Corrigir imediatamente qualquer vazamento identificado.
        # 3. Manter o pipeline interrompendo a execucao em caso de achados.
        # 4. Tratar cada deteccao como incidente de seguranca.
        # 5. Exigir aprovacao antes da promocao para ambientes produtivos.
        #
        # Esta excecao existe exclusivamente para fins educacionais e de
        # demonstracao de vigilancia continua. Para pegar o yml devido, consultar o repositorio do prof Fabio no github.
        # ==================================================================
        continue-on-error: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  revarredura-dependencias:
    name: "Revarredura de Dependencias (Trivy)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy - novas CVEs desde o ultimo scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-agendado.sarif'

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-agendado-trivy
          path: trivy-agendado.sarif
          if-no-files-found: ignore

      - name: Notificar em caso de nova vulnerabilidade
        if: failure()
        run: |
          echo "Uma dependencia anteriormente considerada segura passou a possuir vulnerabilidades conhecidas."
          echo "O objetivo da vigilancia continua e identificar riscos que surgem ao longo do tempo, mesmo sem alteracoes no codigo."
